[package]
name = "gitpulse"
version = "0.1.0"
description = "Local-first Git repository monitor"
authors = ["GitPulse contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
default-run = "gitpulse"

[lib]
name = "gitpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.21.0", default-features = false }
notify = "8.2.2"
ignore = "0.4.34"
rusqlite = { version = "0.41.1", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v7"] }
dunce = "1"
globset = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "gitpulse"
path = "src/main.rs"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
